aid: baton-systems
name: Baton Systems
description: 'Baton Systems is a post-trade settlement and payments technology provider
  founded in 2016, headquartered in Silicon Valley with offices in London, New York,
  and Chennai. Its CORE platform (Core-FX, Core-Payments, Core-Liquidity, and Core-Collateral)
  uses distributed ledger technology (DLT) and payment-versus-payment (PvP) settlement
  to orchestrate real-time FX settlement, intraday liquidity management, collateral
  optimization, and post-trade payment control for global banks and financial institutions.
  Baton operates a live FX PvP settlement service and processes roughly USD 30 billion
  daily for seven of the nine largest Western global systemically important banks,
  having settled trillions in aggregate value. Data flows integrate over APIs and
  standard financial formats including ISO 20022, SWIFT MT, FIXML, and XML.'
